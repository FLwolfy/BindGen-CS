name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
            require-windows-providers: "0"
          - os: windows-2022
            target: windows-x64-msvc
            require-windows-providers: "1"
          - os: macos-15-intel
            target: macos-x64-darwin
            require-windows-providers: "0"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore BindGen-CS.sln

      - name: Build
        run: dotnet build BindGen-CS.sln --configuration Release --no-restore

      - name: Test managed and native runtime matrix
        run: dotnet test BindGen-CS.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/test-results
        env:
          BGCS_REQUIRE_WINDOWS_NATIVE_PROVIDERS: ${{ matrix.require-windows-providers }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: artifacts/test-results

  acceptance:
    name: BGCS acceptance (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
            require-windows-providers: "0"
          - os: windows-2022
            target: windows-x64-msvc
            require-windows-providers: "1"
          - os: macos-15-intel
            target: macos-x64-darwin
            require-windows-providers: "0"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout BindGen-CS
        uses: actions/checkout@v4

      - name: Checkout pinned third-party real-library corpus
        uses: actions/checkout@v4
        with:
          repository: FLwolfy/InnoEngine
          path: .third-party-corpus
          submodules: recursive

      - name: Initialize MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run BGCS maintenance-candidate acceptance matrix
        shell: bash
        run: bash ./scripts/run-full-test-matrix.sh
        env:
          CONFIGURATION: "Release"
          INNOENGINE_ROOT: ${{ github.workspace }}/.third-party-corpus
          BGCS_REQUIRE_WINDOWS_NATIVE_PROVIDERS: ${{ matrix.require-windows-providers }}

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.target }}
          path: artifacts/acceptance
