name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generator:
    name: ${{ matrix.name }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2022
            name: Generator baseline (Windows x64)
            target: windows-x64-msvc
            compiler: ""
            baseline: full
          - os: ubuntu-24.04
            name: Generator smoke (Linux x64)
            target: linux-x64-gnu
            compiler: g++
            baseline: smoke
            rid: linux-x64
          - os: macos-15-intel
            name: Generator smoke (macOS x64)
            target: macos-x64-darwin
            compiler: clang++
            baseline: smoke
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      BGCS_CPP2C_CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install exact locked .NET SDK
        run: python scripts/setup-locked-dotnet.py --install-dir "${{ runner.temp }}/bgcs-dotnet"
      - name: Verify locked SDK and isolated runtime
        run: python scripts/verify-locked-toolchain.py --output artifacts/toolchain/sdk.json
      - name: Install hash-locked performance metrics
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/requirements-performance.txt
      - name: Build locked Intel macOS parser supplement
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BGCS_CLANG_RUNTIME_DIR="$GITHUB_WORKSPACE/artifacts/clang-runtime/osx-x64" bash scripts/setup-macos-x64-clang-runtime.sh
          echo "BGCS_CLANG_RUNTIME_DIR=$GITHUB_WORKSPACE/artifacts/clang-runtime/osx-x64" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/artifacts/clang-runtime/osx-x64" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/artifacts/clang-runtime/bin" >> "$GITHUB_PATH"
      - name: Full retained Windows functionality exactly once
        if: matrix.baseline == 'full'
        shell: bash
        run: python scripts/compiler_test_environment.py -- "$BASH" scripts/run-full-test-matrix.sh
      - name: Build and execute the finite non-Windows generator baseline
        if: matrix.baseline == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          unset Platform PLATFORM platform
          python scripts/source_ownership.py
          dotnet restore tests/BGCS.Tests/BGCS.Tests.csproj
          dotnet build tests/BGCS.Tests/BGCS.Tests.csproj -c Release --no-restore -m:2 -nr:false -p:TreatWarningsAsErrors=true
          dotnet build src/BGCS.Tool/BGCS.Tool.csproj -c Release -m:2 -nr:false -p:TreatWarningsAsErrors=true
          python scripts/run-generator-smoke.py --dotnet "$DOTNET_ROOT/dotnet" --output artifacts/generator-smoke
          python scripts/compiler_test_environment.py -- "$BASH" scripts/test-performance-budget.sh
      - name: Consume the current host SDK and CLI from isolated packages
        if: matrix.baseline == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          unset Platform PLATFORM platform
          version="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          parser=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then parser=(--parser-osx-x64 "$BGCS_CLANG_RUNTIME_DIR"); fi
          python scripts/compiler_test_environment.py -- python eng/pack.py --configuration Release --version "$version" --output artifacts/host-packages --host-only "${{ matrix.rid }}" --include-host-tool --verify-repeat-content "${parser[@]}"
          python scripts/compiler_test_environment.py -- python eng/verify-packages.py --version "$version" --packages artifacts/host-packages --output artifacts/host-installed --sdk-only --host-tool
      - name: Upload exact generator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-feature-evidence-${{ matrix.target }}
          path: |
            ${{ matrix.baseline == 'full' && 'artifacts/acceptance/report.json' || 'artifacts/generator-smoke/report.json' }}
            ${{ matrix.baseline == 'full' && 'artifacts/acceptance/test-results/**/*.trx' || '' }}
            ${{ matrix.baseline == 'full' && 'artifacts/acceptance/test-results/**/*.json' || '' }}
          if-no-files-found: error
      - name: Upload accepted Intel parser closure
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: parser-runtime-osx-x64
          path: artifacts/clang-runtime/osx-x64
          if-no-files-found: error
      - name: Seal the exact repository release tooling
        if: matrix.baseline == 'full'
        run: python scripts/release_payload.py seal-tooling eng/BGCS.RepositoryTools/bin/Release/net10.0 --revision "${{ github.sha }}"
      - name: Upload repository release tooling
        if: matrix.baseline == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: release-repository-tools
          path: eng/BGCS.RepositoryTools/bin/Release/net10.0
          if-no-files-found: error
