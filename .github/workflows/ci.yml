name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore BindGen-CS.sln

      - name: Build
        run: dotnet build BindGen-CS.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BindGen-CS.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

  acceptance-macos-arm64:
    name: Acceptance (macOS arm64)
    runs-on: macos-14

    steps:
      - name: Checkout BindGen-CS
        uses: actions/checkout@v4

      - name: Checkout InnoEngine acceptance corpus
        uses: actions/checkout@v4
        with:
          repository: FLwolfy/InnoEngine
          path: .integration/InnoEngine
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run full acceptance matrix
        run: bash ./scripts/run-full-test-matrix.sh
        env:
          CONFIGURATION: "Release"
          INNOENGINE_ROOT: ${{ github.workspace }}/.integration/InnoEngine

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-macos-arm64
          path: artifacts/acceptance
