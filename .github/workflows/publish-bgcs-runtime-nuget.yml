name: Publish BGCS NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3 or 1.2.3-preview.1)"
        required: true
        type: string

jobs:
  validate-pack-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Version is empty."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore BindGen-CS.sln

      - name: Build
        run: dotnet build BindGen-CS.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.release.outputs.version }}

      - name: Test
        run: dotnet test BindGen-CS.sln --configuration Release --no-build

      - name: Pack and test package closure
        run: ./scripts/test-nuget-packages.sh
        env:
          CONFIGURATION: Release
          PACKAGE_TEST_VERSION: ${{ steps.release.outputs.version }}

      - name: Push packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          packages=(BGCS.Intermediate BGCS.CppAst BGCS.Core BGCS.Language BGCS BGCS.Cpp2C BGCS.Runtime BindGen-CS)
          for package in "${packages[@]}"; do
            dotnet nuget push "artifacts/nuget/${package}.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
            dotnet nuget push "artifacts/nuget/${package}.${VERSION}.snupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
