name: Publish BGCS NuGet

on:
  workflow_run:
    workflows: ["Product package certification"]
    branches: [main]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Accepted public release version (4.1.2; private -ci candidates are never published)"
        required: true
        type: string

concurrency:
  group: bgcs-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    name: Verify accepted release revision
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.acceptance.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      ci-run-id: ${{ steps.acceptance.outputs.ci-run-id }}
      product-run-id: ${{ steps.acceptance.outputs.product-run-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate the current main release candidate
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const release = require('./scripts/release-workflow.js');
            const candidate = await release.resolveCandidate(github, context);
            core.info(candidate.reason);
            core.setOutput('eligible', String(candidate.eligible));
            core.setOutput('revision', candidate.revision);
            core.setOutput('package-run-id', candidate.packageRunId || '');

      - name: Checkout the authenticated source revision
        if: steps.candidate.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.revision }}

      - name: Read the declared release and its notes
        if: steps.candidate.outputs.eligible == 'true'
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          version = ET.parse('Directory.Build.props').findtext('./PropertyGroup/Version')
          if not version or not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
              raise SystemExit('Directory.Build.props must declare a valid release version.')
          if '-ci.' in version or version.endswith('-ci'):
              raise SystemExit('Private source-validation candidates cannot be tagged or published. Accept the final source revision first.')
          requested = os.environ.get('REQUESTED_VERSION', '')
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              requested = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if requested and requested != version:
              raise SystemExit('Requested version differs from the checked-out source version.')
          if not Path(f'docs/releases/{version}.md').is_file():
              raise SystemExit('The declared release must include reviewed release notes.')
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nrevision={revision}\n')
          PY

      - name: Require the full CI matrix for this exact commit
        if: steps.candidate.outputs.eligible == 'true'
        id: acceptance
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ steps.version.outputs.revision }}
          TRIGGER_PACKAGE_RUN_ID: ${{ steps.candidate.outputs.package-run-id }}
        with:
          script: |
            const fs = require('fs');
            const release = require('./scripts/release-workflow.js');
            const gateManifest = JSON.parse(fs.readFileSync('eng/acceptance/required-release-gates.json', 'utf8'));
            const implementation = JSON.parse(fs.readFileSync('eng/acceptance/implementation-status.json', 'utf8'));
            if (gateManifest.requireCleanFeatureInventory !== true || gateManifest.requireProductPackageInstallation !== true) {
              throw new Error('Release preflight requires both exact feature/configuration proof and complete installed-product certification.');
            }
            if (implementation.implementationReady !== true || implementation.releaseReady !== false) {
              throw new Error('The source inventory must have reviewed implementationReady declarations; releaseReady is derived from exact current CI evidence.');
            }
            const repository = context.repo;
            const revision = process.env.RELEASE_REVISION;
            const tag = `v${process.env.RELEASE_VERSION}`;
            if (context.eventName === 'workflow_run') {
              const main = await github.rest.git.getRef({...repository, ref: 'heads/main'});
              if (main.data.object.sha !== revision) {
                core.info('A newer main revision exists; wait for its CI before releasing.');
                core.setOutput('publish', 'false');
                return;
              }
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...repository, workflow_id: 'ci.yml', head_sha: revision,
              event: 'push', branch: 'main', per_page: 100
            });
            const ciWorkflow = (await github.rest.actions.getWorkflow({...repository, workflow_id: gateManifest.workflow})).data;
            const accepted = release.latestAccepted(runs.data.workflow_runs, `${repository.owner}/${repository.repo}`,
              ciWorkflow, 'push', revision);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repository, run_id: accepted.id, filter: 'latest', per_page: 100
            });
            release.validateJobs(jobs, gateManifest.requiredJobNames);
            const path = require('path');
            const childProcess = require('child_process');
            const crypto = require('crypto');
            const evidenceRoot = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'bgcs-release-evidence-'));
            const observation = (run, workflow, observedJobs) => ({
              workflow, id: run.id, headSha: run.head_sha, headBranch: run.head_branch,
              event: run.event, status: run.status, conclusion: run.conclusion,
              displayTitle: run.display_title,
              jobs: observedJobs.map(job => ({name: job.name, status: job.status, conclusion: job.conclusion}))
            });
            const workflowEvidence = {schemaVersion: 1, sourceRevision: revision,
              ci: observation(accepted, gateManifest.workflow, jobs), archiveSha256: {}};
            const workflowEvidencePath = path.join(evidenceRoot, 'workflows.json');
            const featureArguments = ['scripts/verify-feature-release-evidence.py', '--revision', revision,
              '--workflow-evidence', workflowEvidencePath, '--output', 'artifacts/release-preflight/features.json'];
            let productRunId;
            try {
              const featureRequirements = gateManifest.requiredFeatureEvidence;
              if (!Array.isArray(featureRequirements) || !featureRequirements.length ||
                  new Set(featureRequirements.map(item => item.host)).size !== featureRequirements.length)
                throw new Error('The release lacks its explicit unique feature evidence hosts.');
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...repository, run_id: accepted.id, per_page: 100
              });
              for (const required of featureRequirements) {
                const matching = artifacts.filter(item => item.name === required.artifact && !item.expired);
                if (matching.length !== 1 || matching[0].size_in_bytes > 64 * 1024 * 1024)
                  throw new Error(`Missing, ambiguous or oversized feature evidence: ${required.artifact}`);
                const archive = await github.rest.actions.downloadArtifact({
                  ...repository, artifact_id: matching[0].id, archive_format: 'zip'
                });
                const destination = path.join(evidenceRoot, `feature-${matching[0].id}.zip`);
                fs.writeFileSync(destination, Buffer.from(archive.data));
                featureArguments.push('--archive', destination);
              }
              const packageRuns = await github.rest.actions.listWorkflowRuns({
                ...repository, workflow_id: gateManifest.productPackageWorkflow,
                event: 'workflow_run', branch: 'main', per_page: 100
              });
              const packageWorkflow = (await github.rest.actions.getWorkflow({...repository, workflow_id: gateManifest.productPackageWorkflow})).data;
              const packageRun = release.latestAccepted(packageRuns.data.workflow_runs, `${repository.owner}/${repository.repo}`,
                packageWorkflow, 'workflow_run', revision, true);
              if (process.env.TRIGGER_PACKAGE_RUN_ID && Number(process.env.TRIGGER_PACKAGE_RUN_ID) !== packageRun.id)
                throw new Error('The triggering product run is stale; a later run requires its own complete preflight.');
              const packageJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repository, run_id: packageRun.id, filter: 'latest', per_page: 100
              });
              release.validateJobs(packageJobs, gateManifest.requiredProductPackageJobNames);
              productRunId = packageRun.id;
              workflowEvidence.products = observation(packageRun, gateManifest.productPackageWorkflow, packageJobs);
              // workflow_run can describe a newer default-branch tip. Validate the
              // downloaded package/report bytes for every required artifact instead.
              const packageArtifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...repository, run_id: packageRun.id, per_page: 100
              });
              if (!Array.isArray(gateManifest.requiredProductEvidence) ||
                  gateManifest.requiredProductEvidence.length !== gateManifest.requiredProductPackageJobNames.length)
                throw new Error('The release manifest lacks its complete installed-product artifact requirements.');
              for (const required of gateManifest.requiredProductEvidence) {
                const matching = packageArtifacts.filter(item => item.name === required.artifact && !item.expired);
                if (matching.length !== 1 || matching[0].size_in_bytes > 64 * 1024 * 1024)
                  throw new Error(`Missing, ambiguous or oversized installed-product artifact: ${required.artifact}`);
                const artifact = matching[0];
                const archive = await github.rest.actions.downloadArtifact({
                  ...repository, artifact_id: artifact.id, archive_format: 'zip'
                });
                const bytes = Buffer.from(archive.data);
                const destination = path.join(evidenceRoot, `products-${artifact.id}.zip`);
                fs.writeFileSync(destination, bytes);
                workflowEvidence.archiveSha256[artifact.name] = crypto.createHash('sha256').update(bytes).digest('hex');
                featureArguments.push('--product-archive', `${artifact.name}=${destination}`);
              }
              fs.writeFileSync(workflowEvidencePath, JSON.stringify(workflowEvidence));
              // One verifier joins actual host TRX, authenticated job observations,
              // and every independently validated installed execution report.
              core.info(childProcess.execFileSync('python3', featureArguments, {encoding: 'utf8', timeout: 60000, maxBuffer: 65536}));
            } finally {
              fs.rmSync(evidenceRoot, {recursive: true, force: true});
            }
            try {
              const release = await github.rest.repos.getReleaseByTag({...repository, tag});
              if (!release.data.draft) {
                core.info(`${tag} already exists; revalidate immutable tag, exact package payloads and public installation.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const existing = await github.rest.git.getRef({...repository, ref: `tags/${tag}`});
              let object = existing.data.object;
              while (object.type === 'tag') {
                object = (await github.rest.git.getTag({...repository, tag_sha: object.sha})).data.object;
              }
              if (object.sha !== revision) {
                throw new Error('An existing release tag points to a different commit.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.info(`Accepted ${revision} in CI run ${accepted.id}.`);
            // This aggregate result is produced only after every required CI job,
            // feature/configuration proof and installed-product host passed.
            const featureProof = JSON.parse(fs.readFileSync('artifacts/release-preflight/features.json', 'utf8'));
            if (featureProof.featureAcceptanceVerified !== true || featureProof.releaseReady !== false || featureProof.sourceRevision !== revision)
              throw new Error('The derived feature proof does not certify this exact release revision.');
            fs.mkdirSync('artifacts/release-preflight', {recursive: true});
            fs.writeFileSync('artifacts/release-preflight/readiness.json', JSON.stringify({
              schemaVersion: 1, revision, implementationReady: true,
              featureAcceptanceVerified: true, releaseReady: true,
              publicationVerified: false, checkedOutSourceSha256: featureProof.checkedOutSourceSha256,
              featureProofSha256: crypto.createHash('sha256').update(fs.readFileSync('artifacts/release-preflight/features.json')).digest('hex'),
              ciRunId: accepted.id, productRunId, requiredGates: gateManifest
            }, null, 2) + '\n');
            core.setOutput('ci-run-id', accepted.id);
            core.setOutput('product-run-id', productRunId);
            core.setOutput('publish', 'true');

      - name: Preserve exact per-feature release proof
        if: steps.acceptance.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-feature-proof-${{ steps.version.outputs.revision }}
          path: artifacts/release-preflight/*.json
          if-no-files-found: error

  validate-pack-and-publish:
    needs: release-preflight
    if: needs.release-preflight.outputs.publish == 'true'
    timeout-minutes: 360
    runs-on: ubuntu-24.04
    env:
      BGCS_CPP2C_CXX: g++
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-preflight.outputs.revision }}

      - name: Setup Python for installed product certification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact locked .NET SDK
        run: python scripts/setup-locked-dotnet.py --install-dir "${{ runner.temp }}/bgcs-dotnet"

      - name: Verify locked SDK and isolated runtime
        run: python scripts/verify-locked-toolchain.py --output artifacts/toolchain/sdk.json

      - name: Download same-revision per-feature release proof
        uses: actions/download-artifact@v4
        with:
          name: release-feature-proof-${{ needs.release-preflight.outputs.revision }}
          path: artifacts/supply-chain/release-features

      - name: Resolve release version
        id: release
        shell: bash
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download accepted product packages
        uses: actions/download-artifact@v4
        with:
          name: accepted-product-packages
          path: artifacts/nuget
          run-id: ${{ needs.release-preflight.outputs.product-run-id }}
          github-token: ${{ github.token }}
      - name: Download exact installed product receipt
        uses: actions/download-artifact@v4
        with:
          name: product-package-evidence-windows-2022
          path: artifacts/verification/packages
          run-id: ${{ needs.release-preflight.outputs.product-run-id }}
          github-token: ${{ github.token }}
      - name: Download accepted repository release tooling
        uses: actions/download-artifact@v4
        with:
          name: release-repository-tools
          path: artifacts/release-tooling
          run-id: ${{ needs.release-preflight.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - name: Authenticate every accepted package and tooling byte
        run: |
          python scripts/release_payload.py verify-packages artifacts/nuget --verification artifacts/verification/packages/verification.json --revision "${{ needs.release-preflight.outputs.revision }}" --version "${{ steps.release.outputs.version }}"
          python scripts/release_payload.py verify-tooling artifacts/release-tooling --revision "${{ needs.release-preflight.outputs.revision }}"

      - name: Assert Intel runtime is in published parser package
        shell: bash
        run: |
          package="artifacts/nuget/BGCS.ParserRuntime.osx-x64.${{ steps.release.outputs.version }}.nupkg"
          unzip -Z1 "${package}" | grep -Fx 'runtimes/osx-x64/native/libclang.dylib'
          unzip -Z1 "${package}" | grep -Fx 'runtimes/osx-x64/native/libClangSharp.dylib'

      - name: Validate release package set before signing or upload
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('distribution/manifests/product-packages.json').read_text(encoding='utf-8'))
          version = os.environ['VERSION']
          products = [*manifest['products'], *manifest['optionalProducts'], *manifest['technicalPackages'],
                      *('BindGen-CS.' + rid for rid in manifest['toolRuntimeIdentifiers'])]
          expected = {f'{name}.{version}.nupkg' for name in products}
          expected |= {f'{name}.{version}.snupkg' for name in manifest['symbolProducts']}
          directory = Path('artifacts/nuget')
          actual = {path.name for pattern in ('*.nupkg', '*.snupkg') for path in directory.glob(pattern)}
          if actual != expected:
              raise SystemExit(f'Release package set differs: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}')
          print(f'Authenticated the complete {len(expected)}-archive release set.')
          PY

      - name: Generate SPDX SBOM and SLSA provenance
        run: >-
          dotnet artifacts/release-tooling/BGCS.RepositoryTools.dll
          supply-chain artifacts/nuget --output artifacts/supply-chain
          --revision "${{ needs.release-preflight.outputs.revision }}"
          --builder-id "https://github.com/${{ github.repository }}/.github/workflows/publish-bgcs-runtime-nuget.yml@${{ github.workflow_sha }}"
          --timestamp "$(git show -s --format=%cI HEAD)"

      - name: Write the release package checksums
        shell: bash
        run: |
          cd artifacts/nuget
          sha256sum *.nupkg *.snupkg > ../supply-chain/SHA256SUMS

      - name: Sign build provenance with GitHub OIDC
        id: provenance-attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Sign SPDX SBOM association with GitHub OIDC
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          sbom-path: artifacts/supply-chain/sbom.spdx.json

      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: bindgen-cs-supply-chain-${{ steps.release.outputs.version }}
          path: |
            artifacts/supply-chain
            ${{ steps.provenance-attestation.outputs.bundle-path }}
            ${{ steps.sbom-attestation.outputs.bundle-path }}

      # nuget.org trusted publishing: exchange the job OIDC token for an API
      # key that expires in one hour, so request it right before the push.
      - name: Recheck physical package hashes before creating the immutable version tag
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import json
          import os
          spec = importlib.util.spec_from_file_location('installed_package_verifier', 'eng/verify-packages.py')
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          report = json.loads(Path('artifacts/verification/packages/verification.json').read_text())
          actual = verifier.verify_package_receipt(Path('artifacts/nuget'), report['version'], report['sourceRevision'], True)
          if actual != report['packagingEvidence']:
              raise SystemExit('The installed packages or their physical receipt changed after consumption.')
          PY

      - name: Create the accepted main version tag and continue publishing in this same job
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ needs.release-preflight.outputs.revision }}
        with:
          script: |
            const fs = require('fs');
            const release = require('./scripts/release-workflow.js');
            const result = await release.ensureTag(github, context.repo, {
              revision: process.env.RELEASE_REVISION, version: process.env.RELEASE_VERSION,
              readiness: JSON.parse(fs.readFileSync('artifacts/supply-chain/release-features/readiness.json')),
              featureBytes: fs.readFileSync('artifacts/supply-chain/release-features/features.json'),
              packageVerification: JSON.parse(fs.readFileSync('artifacts/verification/packages/verification.json')),
              gateManifest: JSON.parse(fs.readFileSync('eng/acceptance/required-release-gates.json'))
            });
            core.info(`Immutable ${result.tag} identifies accepted main ${result.revision}; created=${result.created}.`);
            // GITHUB_TOKEN-created tags do not start another push workflow. All
            // NuGet publishing and public-consumption checks continue below.

      - name: Exchange GitHub OIDC token for a nuget.org API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mapfile -t libraries < <(python -c "import json; m=json.load(open('distribution/manifests/product-packages.json')); print('\n'.join([p for p in m['products'] if p != 'BindGen-CS'] + m['optionalProducts']))")
          mapfile -t symbols < <(python -c "import json; m=json.load(open('distribution/manifests/product-packages.json')); print('\n'.join(m['symbolProducts']))")
          mapfile -t technical < <(python -c "import json; m=json.load(open('distribution/manifests/product-packages.json')); print('\n'.join(m['technicalPackages']))")
          mapfile -t tool_rids < <(python -c "import json; m=json.load(open('distribution/manifests/product-packages.json')); print('\n'.join(m['toolRuntimeIdentifiers']))")
          for package in "${technical[@]}"; do
            dotnet nuget push "artifacts/nuget/${package}.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
          for package in "${libraries[@]}"; do
            dotnet nuget push "artifacts/nuget/${package}.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
          for package in "${symbols[@]}"; do
            dotnet nuget push "artifacts/nuget/${package}.${VERSION}.snupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
          # RID packages first: the pointer package is unusable until they resolve.
          for rid in "${tool_rids[@]}"; do
            dotnet nuget push "artifacts/nuget/BindGen-CS.${rid}.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
          dotnet nuget push "artifacts/nuget/BindGen-CS.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Require public NuGet indexing, matching payloads and clean four-product installs
        run: >-
          python scripts/verify-published-products.py
          --version "${{ steps.release.outputs.version }}" --packages artifacts/nuget
          --output artifacts/supply-chain/nuget-public-verification.json

      - name: Preserve public NuGet consumption evidence
        uses: actions/upload-artifact@v4
        with:
          name: bindgen-cs-public-nuget-${{ steps.release.outputs.version }}
          path: |
            artifacts/supply-chain/nuget-public-verification.json
            artifacts/supply-chain/nuget-public-logs
          if-no-files-found: error

      - name: Publish GitHub release and its verified package set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ needs.release-preflight.outputs.revision }}
          PROVENANCE_BUNDLE: ${{ steps.provenance-attestation.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate)"
          if ! jq -e --arg tag "v${VERSION}" '.[] | select(.tag_name == $tag)' <<< "${releases}" > /dev/null; then
            gh release create "v${VERSION}" \
              --target "${REVISION}" \
              --title "BGCS ${VERSION}" \
              --notes-file "docs/releases/${VERSION}.md" \
              --draft
          fi
          cp "${PROVENANCE_BUNDLE}" artifacts/supply-chain/provenance-attestation.json
          cp "${SBOM_BUNDLE}" artifacts/supply-chain/sbom-attestation.json
          gh release upload "v${VERSION}" \
            --clobber \
            artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg \
            artifacts/supply-chain/sbom.spdx.json \
            artifacts/supply-chain/provenance.slsa.json \
            artifacts/supply-chain/SHA256SUMS \
            artifacts/supply-chain/provenance-attestation.json \
            artifacts/supply-chain/sbom-attestation.json \
            artifacts/supply-chain/nuget-public-verification.json \
            artifacts/supply-chain/release-features/features.json
          if [[ "${VERSION}" == *-* ]]; then
            gh release edit "v${VERSION}" --draft=false --prerelease
          else
            gh release edit "v${VERSION}" --draft=false --latest
          fi
