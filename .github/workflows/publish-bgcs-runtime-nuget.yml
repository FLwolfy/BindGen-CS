name: Publish BGCS NuGet

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3 or 1.2.3-preview.1)"
        required: true
        type: string

concurrency:
  group: bgcs-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    name: Verify accepted release revision
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.acceptance.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read the declared release and its notes
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          version = ET.parse('Directory.Build.props').findtext('./PropertyGroup/Version')
          if not version or not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
              raise SystemExit('Directory.Build.props must declare a valid release version.')
          requested = os.environ.get('REQUESTED_VERSION', '')
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              requested = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if requested and requested != version:
              raise SystemExit('Requested version differs from the checked-out source version.')
          if not Path(f'docs/releases/{version}.md').is_file():
              raise SystemExit('The declared release must include reviewed release notes.')
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nrevision={revision}\n')
          PY

      - name: Require the full CI matrix for this exact commit
        id: acceptance
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ steps.version.outputs.revision }}
        with:
          script: |
            const repository = context.repo;
            const revision = process.env.RELEASE_REVISION;
            const tag = `v${process.env.RELEASE_VERSION}`;
            if (context.eventName === 'workflow_run') {
              const main = await github.rest.git.getRef({...repository, ref: 'heads/main'});
              if (main.data.object.sha !== revision) {
                core.info('A newer main revision exists; wait for its CI before releasing.');
                core.setOutput('publish', 'false');
                return;
              }
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...repository, workflow_id: 'ci.yml', head_sha: revision,
              event: 'push', branch: 'main', per_page: 100
            });
            const accepted = runs.data.workflow_runs.find(run =>
              run.head_sha === revision && run.status === 'completed' &&
              run.conclusion === 'success');
            if (!accepted) {
              throw new Error('No successful main-branch CI exists for the release commit.');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repository, run_id: accepted.id, filter: 'latest', per_page: 100
            });
            if (jobs.length !== 15 || jobs.some(job => job.conclusion !== 'success')) {
              throw new Error('The complete 15-job CI matrix must pass before publishing.');
            }
            try {
              const release = await github.rest.repos.getReleaseByTag({...repository, tag});
              if (!release.data.draft) {
                core.info(`${tag} is already published; this commit does not request another release.`);
                core.setOutput('publish', 'false');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const existing = await github.rest.git.getRef({...repository, ref: `tags/${tag}`});
              let object = existing.data.object;
              while (object.type === 'tag') {
                object = (await github.rest.git.getTag({...repository, tag_sha: object.sha})).data.object;
              }
              if (object.sha !== revision) {
                throw new Error('An existing release tag points to a different commit.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.info(`Accepted ${revision} in CI run ${accepted.id}.`);
            core.setOutput('publish', 'true');

  release-candidate:
    name: Release candidate (${{ matrix.target }})
    needs: release-preflight
    if: needs.release-preflight.outputs.publish == 'true'
    timeout-minutes: 60
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
            require-windows-providers: "0"
            cpp-compiler: g++
          - os: windows-2022
            target: windows-x64-msvc
            require-windows-providers: "1"
            cpp-compiler: ""
          - os: macos-15-intel
            target: macos-x64-darwin
            require-windows-providers: "0"
            cpp-compiler: clang++
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout BindGen-CS
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-preflight.outputs.revision }}

      - name: Initialize MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK 10 packs RID-specific tool packages; net9.0 assemblies need the 9 runtime.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build missing ClangSharp 20 runtime for macOS Intel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          runtime_dir="${GITHUB_WORKSPACE}/artifacts/clang-runtime/osx-x64"
          BGCS_CLANG_RUNTIME_DIR="${runtime_dir}" bash ./scripts/setup-macos-x64-clang-runtime.sh
          echo "BGCS_CLANG_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"
          echo "BGCS_OSX_X64_PACKAGE_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix llvm@20)/lib:${runtime_dir}" >> "${GITHUB_ENV}"
          echo "${GITHUB_WORKSPACE}/artifacts/clang-runtime/bin" >> "${GITHUB_PATH}"

      - name: Run complete BGCS acceptance
        shell: bash
        run: bash ./scripts/run-full-test-matrix.sh
        env:
          CONFIGURATION: Release
          BGCS_REQUIRE_WINDOWS_NATIVE_PROVIDERS: ${{ matrix.require-windows-providers }}
          BGCS_CPP2C_CXX: ${{ matrix.cpp-compiler }}

      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.target }}
          path: artifacts/acceptance

      - name: Upload unreviewed host snapshot inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-inputs-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            artifacts/acceptance/candidate-snapshots
            artifacts/real-libraries/*/Generated/Bindings.cs
            artifacts/real-libraries/*/public-api.txt
            artifacts/real-cpp-libraries/bimg/Bridge/include/Classes.h
            artifacts/real-cpp-libraries/bimg/Bridge/src/Classes.cpp
            artifacts/real-cpp-libraries/bimg/GeneratedOneStep/Bindings.cs
            artifacts/real-cpp-libraries/bimg/public-api.txt

      - name: Upload relocatable macOS Intel parser runtime
        if: matrix.target == 'macos-x64-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: parser-runtime-osx-x64
          path: artifacts/clang-runtime/osx-x64
          if-no-files-found: error

  validate-pack-and-publish:
    needs: [release-preflight, release-candidate]
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      BGCS_CPP2C_CXX: g++
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-preflight.outputs.revision }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Download accepted macOS Intel parser runtime
        uses: actions/download-artifact@v4
        with:
          name: parser-runtime-osx-x64
          path: artifacts/clang-runtime/osx-x64

      - name: Resolve release version
        id: release
        shell: bash
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore BindGen-CS.sln

      - name: Build
        run: dotnet build BindGen-CS.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.release.outputs.version }}

      - name: Test
        run: dotnet test BindGen-CS.sln --configuration Release --no-build

      - name: Public API compatibility gate
        run: ./scripts/test-public-api-snapshot.sh

      - name: Dependency license and vulnerability gate
        run: ./scripts/test-supply-chain-policy.sh

      - name: Pack and test package closure
        run: ./scripts/test-nuget-packages.sh
        env:
          CONFIGURATION: Release
          PACKAGE_TEST_VERSION: ${{ steps.release.outputs.version }}
          BGCS_OSX_X64_PACKAGE_RUNTIME_DIR: ${{ github.workspace }}/artifacts/clang-runtime/osx-x64

      - name: Assert Intel runtime is in published parser package
        shell: bash
        run: |
          package="artifacts/nuget/BGCS.CppAst.${{ steps.release.outputs.version }}.nupkg"
          unzip -Z1 "${package}" | grep -Fx 'runtimes/osx-x64/native/libclang.dylib'
          unzip -Z1 "${package}" | grep -Fx 'runtimes/osx-x64/native/libClangSharp.dylib'

      - name: Validate release package set before signing or upload
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          shopt -s nullglob
          require_package() {
            if [[ ! -f "artifacts/nuget/$1" ]]; then
              echo "Missing release package: $1" >&2
              exit 1
            fi
          }
          libraries=(BGCS.Intermediate BGCS.CppAst BGCS.Core BGCS.Language BGCS BGCS.Cpp2C BGCS.Runtime)
          tool_rids=(win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64)
          for package in "${libraries[@]}"; do
            require_package "${package}.${VERSION}.nupkg"
            require_package "${package}.${VERSION}.snupkg"
          done
          require_package "BindGen-CS.${VERSION}.nupkg"
          for rid in "${tool_rids[@]}"; do
            require_package "BindGen-CS.${rid}.${VERSION}.nupkg"
          done
          packages=(artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg)
          expected=$(( ${#libraries[@]} * 2 + 1 + ${#tool_rids[@]} ))
          if (( ${#packages[@]} != expected )); then
            echo "Expected ${expected} release packages, found ${#packages[@]}." >&2
            exit 1
          fi

      - name: Generate SPDX SBOM and SLSA provenance
        run: >-
          dotnet run --project src/BGCS.Tool/BGCS.Tool.csproj --configuration Release --no-build --
          supply-chain artifacts/nuget --output artifacts/supply-chain
          --revision "${{ needs.release-preflight.outputs.revision }}"
          --timestamp "$(git show -s --format=%cI HEAD)"

      - name: Write the release package checksums
        shell: bash
        run: |
          cd artifacts/nuget
          sha256sum *.nupkg *.snupkg > ../supply-chain/SHA256SUMS

      - name: Sign build provenance with GitHub OIDC
        id: provenance-attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Sign SPDX SBOM association with GitHub OIDC
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          sbom-path: artifacts/supply-chain/sbom.spdx.json

      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: bindgen-cs-supply-chain-${{ steps.release.outputs.version }}
          path: |
            artifacts/supply-chain
            ${{ steps.provenance-attestation.outputs.bundle-path }}
            ${{ steps.sbom-attestation.outputs.bundle-path }}

      # nuget.org trusted publishing: exchange the job OIDC token for an API
      # key that expires in one hour, so request it right before the push.
      - name: Exchange GitHub OIDC token for a nuget.org API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          libraries=(BGCS.Intermediate BGCS.CppAst BGCS.Core BGCS.Language BGCS BGCS.Cpp2C BGCS.Runtime)
          tool_rids=(win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64)
          for package in "${libraries[@]}"; do
            dotnet nuget push "artifacts/nuget/${package}.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
            dotnet nuget push "artifacts/nuget/${package}.${VERSION}.snupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
          # RID packages first: the pointer package is unusable until they resolve.
          for rid in "${tool_rids[@]}"; do
            dotnet nuget push "artifacts/nuget/BindGen-CS.${rid}.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          done
          dotnet nuget push "artifacts/nuget/BindGen-CS.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Publish GitHub release and its verified package set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ needs.release-preflight.outputs.revision }}
          PROVENANCE_BUNDLE: ${{ steps.provenance-attestation.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate)"
          if ! jq -e --arg tag "v${VERSION}" '.[] | select(.tag_name == $tag)' <<< "${releases}" > /dev/null; then
            gh release create "v${VERSION}" \
              --target "${REVISION}" \
              --title "BGCS ${VERSION}" \
              --notes-file "docs/releases/${VERSION}.md" \
              --draft
          fi
          cp "${PROVENANCE_BUNDLE}" artifacts/supply-chain/provenance-attestation.json
          cp "${SBOM_BUNDLE}" artifacts/supply-chain/sbom-attestation.json
          gh release upload "v${VERSION}" \
            --clobber \
            artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg \
            artifacts/supply-chain/sbom.spdx.json \
            artifacts/supply-chain/provenance.slsa.json \
            artifacts/supply-chain/SHA256SUMS \
            artifacts/supply-chain/provenance-attestation.json \
            artifacts/supply-chain/sbom-attestation.json
          if [[ "${VERSION}" == *-* ]]; then
            gh release edit "v${VERSION}" --draft=false --prerelease
          else
            gh release edit "v${VERSION}" --draft=false --latest
          fi
