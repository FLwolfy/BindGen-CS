name: Product package certification
run-name: BGCS installed products at ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: bgcs-packages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  packages:
    name: Installed product baseline
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 90
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact locked .NET SDK
        run: python scripts/setup-locked-dotnet.py --install-dir "${{ runner.temp }}/bgcs-dotnet"

      - name: Verify locked SDK and isolated runtime
        run: python scripts/verify-locked-toolchain.py --output artifacts/toolchain/sdk.json
      - name: Initialize MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download same-revision accepted Intel macOS parser
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: parser-runtime-osx-x64
          path: artifacts/clang-runtime/osx-x64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify locked parser resources
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          cd artifacts/clang-runtime/osx-x64
          sha256sum --check --strict SHA256SUMS
          cd ../../..
          python scripts/parser_runtime_provenance.py verify artifacts/clang-runtime/osx-x64
      - name: Pack and install all four products
        shell: bash
        env:
          CONFIGURATION: Release
          BGCS_OSX_X64_PACKAGE_RUNTIME_DIR: ${{ github.workspace }}/artifacts/clang-runtime/osx-x64
        run: |
          export PACKAGE_TEST_VERSION="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext("./PropertyGroup/Version"))' | tr -d '\r')"
          python scripts/compiler_test_environment.py -- "$BASH" scripts/test-nuget-packages.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-package-evidence-windows-2022
          path: artifacts/verification/packages
          overwrite: true
      - name: Upload accepted product packages without repacking
        uses: actions/upload-artifact@v4
        with:
          name: accepted-product-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/nuget/package-verification.json
          if-no-files-found: error
