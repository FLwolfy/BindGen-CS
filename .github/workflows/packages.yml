name: Product package certification
run-name: BGCS installed products at ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: bgcs-packages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  packages:
    name: Installed BGCS products (${{ matrix.os }})
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/bgcs-dotnet
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify locked SDK and isolated runtime
        run: python scripts/verify-locked-toolchain.py --output artifacts/toolchain/sdk.json
      - name: Initialize MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Discover actual Visual Studio2026 MSBuild.exe
        if: matrix.os == 'windows-2025-vs2026'
        shell: pwsh
        run: |
          $instances = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products '*' -requires Microsoft.Component.MSBuild -version '[18.0,19.0)' -format json -utf8 | ConvertFrom-Json
          $instance = $instances | Where-Object { $_.catalog.productLineVersion -eq '2026' } | Select-Object -First 1
          if ($null -eq $instance) { throw 'The dedicated runner did not supply an actual Visual Studio2026 installation.' }
          $taskMsbuild = Join-Path $instance.installationPath 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $taskMsbuild -PathType Leaf)) { throw 'Visual Studio2026 MSBuild.exe is unavailable.' }
          "BGCS_MSBUILD_EXE=$taskMsbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download same-revision accepted Intel macOS parser
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: parser-runtime-osx-x64
          path: artifacts/clang-runtime/osx-x64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify locked parser resources
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          cd artifacts/clang-runtime/osx-x64
          sha256sum --check --strict SHA256SUMS
          cd ../../..
          python scripts/parser_runtime_provenance.py verify artifacts/clang-runtime/osx-x64
      - name: Install .NET 10 native WebAssembly workload for installed products
        shell: bash
        run: python scripts/verify-locked-toolchain.py --install-workloads --output artifacts/toolchain/wasm.json
      - name: Pack and install all four products
        shell: bash
        env:
          CONFIGURATION: Release
          BGCS_OSX_X64_PACKAGE_RUNTIME_DIR: ${{ github.workspace }}/artifacts/clang-runtime/osx-x64
        run: python scripts/compiler_test_environment.py -- bash scripts/test-nuget-packages.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-package-evidence-${{ matrix.os }}
          path: artifacts/verification/packages
          overwrite: true
